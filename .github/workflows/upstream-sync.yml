# Synchronisation hebdomadaire du fork avec mtlynch/picoshare (master).
#
# 1. sync : fusionne upstream/master dans master avec un vrai commit de merge
#    (jamais de squash ni de rebase, pour garder la base commune). Le dossier
#    .github/ reste toujours celui du fork (sa CI lui appartient, et
#    GITHUB_TOKEN ne peut pas pousser de modification de workflow). Le
#    résultat est poussé (force) sur la branche upstream-sync.
#    Échec si un conflit subsiste hors de .github/, ou si deux migrations de
#    store/sqlite/migrations/ partagent le même numéro (conflit sémantique
#    invisible pour git).
# 2. ci : toute la CI (ci.yml, appelé comme workflow réutilisable) sur le
#    commit de fusion.
# 3. promote : si la CI passe (et hors dry_run), fast-forward de master vers le
#    commit de fusion (refusé proprement si master a bougé), suppression de la
#    branche upstream-sync, puis lancement de release.yml (un push fait avec
#    GITHUB_TOKEN ne déclenche aucun workflow).
# 4. issue : en cas d'échec, ouvre ou complète l'issue « Synchro upstream à
#    faire à la main » (label upstream-sync) ; la ferme quand une synchro
#    aboutit ou que master contient déjà upstream.
# Master n'est jamais modifié en cas d'échec.
# Les actions sont épinglées par SHA et mises à jour par Dependabot.
name: Synchro upstream

on:
  schedule:
    # Mardi 03:00 UTC = 04:00 à Paris en hiver (05:00 en été).
    - cron: "0 3 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Tout faire sauf modifier master et lancer la release"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/mtlynch/picoshare
  SYNC_BRANCH: upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # pousser la branche upstream-sync
    outputs:
      # uptodate | ready | conflict | migrations | push
      status: ${{ steps.merge.outputs.status }}
      sha: ${{ steps.merge.outputs.sha }}
      upstream_sha: ${{ steps.merge.outputs.upstream_sha }}
      reason: ${{ steps.merge.outputs.reason }}
      files: ${{ steps.merge.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          # Identifiants conservés pour pousser la branche upstream-sync.
          # Aucun code du dépôt n'est exécuté dans ce job.
          persist-credentials: true

      - name: Fusionner upstream/master
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898783+github-actions[bot]@users.noreply.github.com'

          # Écrit une sortie multi-ligne dans GITHUB_OUTPUT.
          output() {
            local delim
            delim="EOF_$(openssl rand -hex 8)"
            printf '%s<<%s\n%s\n%s\n' "$1" "${delim}" "$2" "${delim}" >> "${GITHUB_OUTPUT}"
          }
          fail() {
            output status "$1"
            output reason "$2"
            output files "${3:-}"
            echo "::error::$2"
            exit 1
          }

          git fetch --no-tags "${UPSTREAM_URL}" master
          upstream="$(git rev-parse FETCH_HEAD)"
          output upstream_sha "${upstream}"

          if git merge-base --is-ancestor "${upstream}" HEAD; then
            echo "master contient déjà ${upstream}, rien à faire."
            output status uptodate
            exit 0
          fi

          echo "Commits upstream à intégrer :"
          git log --oneline "HEAD..${upstream}"

          # Code de retour non nul en cas de conflit : traité plus bas.
          git merge --no-ff --no-commit "${upstream}" || true

          # .github/ reste celui du fork : restaure les fichiers du fork, puis
          # retire ceux qu'upstream ajouterait (ou modifierait alors que le
          # fork les a supprimés).
          git checkout HEAD -- .github
          extra="$(comm -13 \
            <(git ls-tree -r --name-only HEAD -- .github | sort) \
            <(git ls-files -- .github | sort -u))"
          if [[ -n "${extra}" ]]; then
            echo "Fichiers .github d'upstream ignorés :"
            echo "${extra}"
            xargs -d '\n' git rm -q -f -- <<< "${extra}"
          fi

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${conflicts}" ]]; then
            fail conflict "Conflits de fusion hors de .github/" "${conflicts}"
          fi

          # Deux migrations avec le même numéro : git ne voit aucun conflit,
          # mais l'une d'elles ne serait jamais appliquée sur les bases du fork.
          dup="$(git ls-files -- store/sqlite/migrations \
            | sed -nE 's#^.*/([0-9]+)-[^/]*$#\1#p' | sort | uniq -d)"
          if [[ -n "${dup}" ]]; then
            files="$(git ls-files -- store/sqlite/migrations \
              | grep -E "/($(paste -sd'|' <<< "${dup}"))-")"
            fail migrations "Numéros de migration en double dans store/sqlite/migrations/" "${files}"
          fi

          # "chore" donne une version correctif dans release.yml (un commit
          # upstream "feat:" en donnerait une mineure).
          git commit -q \
            -m "chore(upstream): fusion de mtlynch/picoshare ${upstream:0:7}" \
            -m "$(git log --format='- %h %s' "HEAD..${upstream}")"
          sha="$(git rev-parse HEAD)"
          git show --stat --oneline HEAD | tail -n 3

          if ! git push --force origin "HEAD:refs/heads/${SYNC_BRANCH}"; then
            hint=""
            if [[ -n "$(git log --format=%h "HEAD^1..${upstream}" -- .github/workflows)" ]]; then
              hint=" (des commits upstream modifient .github/workflows : GITHUB_TOKEN n'a pas la permission workflows)"
            fi
            fail push "Push de la branche ${SYNC_BRANCH} refusé${hint}"
          fi
          output status ready
          output sha "${sha}"

  ci:
    needs: sync
    if: needs.sync.outputs.status == 'ready'
    # Plafond des permissions du workflow appelé : il doit couvrir celles que
    # demandent tous ses jobs, y compris dependabot-merge (qui reste inactif
    # ici). Chaque job de ci.yml ne reçoit que les permissions qu'il déclare.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}

  promote:
    needs: [sync, ci]
    if: needs.ci.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # avancer master, supprimer upstream-sync
      actions: write # lancer release.yml
    steps:
      - name: Avancer master, nettoyer et lancer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ needs.sync.outputs.sha }}
        run: |
          set -euo pipefail
          # force=false : fast-forward uniquement, refusé si master a bougé.
          gh api -X PATCH "repos/${GH_REPO}/git/refs/heads/master" \
            -f sha="${SHA}" -F force=false --silent
          gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${SYNC_BRANCH}" \
            --silent || true
          gh workflow run release.yml --ref master

  issue:
    needs: [sync, ci, promote]
    # Rien à signaler si le run a été annulé.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Ouvrir, compléter ou fermer l'issue de synchro
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          SYNC_RESULT: ${{ needs.sync.result }}
          CI_RESULT: ${{ needs.ci.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          STATUS: ${{ needs.sync.outputs.status }}
          REASON: ${{ needs.sync.outputs.reason }}
          FILES: ${{ needs.sync.outputs.files }}
          UPSTREAM_SHA: ${{ needs.sync.outputs.upstream_sha }}
          SHA: ${{ needs.sync.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Synchro upstream à faire à la main"
          label="upstream-sync"
          number="$(gh issue list --state open --label "${label}" \
            --json number --jq '.[0].number // empty')"

          reason=""
          if [[ "${SYNC_RESULT}" != success ]]; then
            reason="${REASON:-Échec inattendu du job sync}"
          elif [[ "${STATUS}" == ready && "${CI_RESULT}" != success ]]; then
            reason="CI ${CI_RESULT} sur le commit de fusion ${SHA:0:7} (branche ${SYNC_BRANCH})"
          elif [[ "${STATUS}" == ready && "${DRY_RUN}" != true \
            && "${PROMOTE_RESULT}" != success ]]; then
            reason="Fast-forward de master refusé ou release non lancée (master a peut-être bougé pendant la synchro)"
          fi

          if [[ -z "${reason}" ]]; then
            synced=false
            [[ "${STATUS}" == uptodate ]] && synced=true
            [[ "${PROMOTE_RESULT}" == success ]] && synced=true
            if [[ "${synced}" == true && -n "${number}" ]]; then
              gh issue close "${number}" \
                --comment "Synchro réussie (upstream ${UPSTREAM_SHA:0:7}) : ${RUN_URL}"
            fi
            exit 0
          fi

          fence='```'
          body="La synchro automatique avec mtlynch/picoshare a échoué ; master n'a pas été modifié.

          - **Raison** : ${reason}
          - **Upstream** : ${UPSTREAM_SHA:-inconnu}
          - **Run** : ${RUN_URL}"
          if [[ -n "${FILES:-}" ]]; then
            body+="

          Fichiers concernés :

          ${fence}
          ${FILES}
          ${fence}"
          fi
          body+="

          À la main : \`git fetch upstream && git merge --no-ff upstream/master\`, garder \`.github/\` du fork, renuméroter les migrations en double, puis PR vers master."

          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh label create "${label}" --color B60205 \
              --description "Synchro automatique avec upstream" --force
            gh issue create --title "${title}" --label "${label}" --body "${body}"
          fi
